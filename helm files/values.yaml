frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: 6.5.4
  resources:
    limits:
      cpu: 150m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

redis:
  storage: 1Gi
  image:
    repository: redis
    tag: 7-alpine

ingress:
  enabled: true
  host: myapp.local

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50