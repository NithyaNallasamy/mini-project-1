#3. Flask Frontend Deployment & Service (03-frontend.yaml)
#This deployment uses inlets/redis-hit-counter (or any equivalent standard Python Flask hit counter image) and includes rolling update strategies and probes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mini-project-1
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.5.4 # lightweight web app that connects to redis
          ports:
            - containerPort: 9898
              name: http
          env:
            - name: PODINFO_CACHE_SERVER
              value: "tcp://redis-svc:6379"
            # Using env variables populated from ConfigMap & Secret
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: mini-project-1
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 9898
      name: http

      