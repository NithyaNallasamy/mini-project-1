apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    app: frontend
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 9898
      name: http
  selector:
    app: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}


